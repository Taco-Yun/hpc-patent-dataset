[project]
name = "patent-crawler"
version = "0.1.0"
description = "Crawl Google Patents and parse patent pages into a structured dataset."
readme = "README.md"
license = "MIT"
authors = [{ name = "yun-yun", email = "tacoyunyun@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "pandas>=2.2.3",
    "requests>=2.32.3",
    # undetected-chromedriver imports distutils, which was removed in Python 3.12; setuptools provides it.
    "setuptools>=78.0.2",
    "tqdm>=4.67.1",
    "undetected-chromedriver>=3.5.5",
]

[tool.uv]
# Scripts only, nothing to build or install as a package.
package = false
